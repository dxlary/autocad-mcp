name: 功能请求 / Feature request
description: 提议一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 这个功能是为了解决什么痛点？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 拟议方案
      description: 你希望怎么实现？或期望的行为
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 其他背景 / 截图
